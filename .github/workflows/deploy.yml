name: Deploy imecht.gg

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SFTP dependency
        run: python -m pip install 'paramiko>=3.4,<5'

      - name: Download Minecraft statistics over SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ vars.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_SERVER_ROOT: ${{ vars.SFTP_SERVER_ROOT }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: python scripts/fetch_sftp.py --dest downloaded-minecraft

      - name: Generate website statistics
        run: python scripts/build_stats.py --server-dir downloaded-minecraft --output public/stats/data.json

      - name: Check for changes in public statistics
        id: stats
        run: python scripts/check_stats_changed.py

      - name: Setup Node
        if: github.event_name == 'push' || steps.stats.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        if: github.event_name == 'push' || steps.stats.outputs.changed == 'true'
        run: npm ci

      - name: Build
        if: github.event_name == 'push' || steps.stats.outputs.changed == 'true'
        run: npm run build

      - name: Setup GitHub Pages
        if: github.event_name == 'push' || steps.stats.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name == 'push' || steps.stats.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

      - name: Deploy
        if: github.event_name == 'push' || steps.stats.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
